<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GTI — Green Technology Investments. NextGEN CD-SEM & DR-SEM metrology, remanufacturing, spares, and service." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/site.css" />
  <title>Contact | GTI</title>
</head>
<body>
  <div class="site-shell">
    <header class="nav" id="site-nav"></header>
    <div class="mobile-panel" id="mobile-panel"></div>
    <main class="site-main">
      <header class="page-hero">
        <div class="container">
          <p class="eyebrow">Contact</p>
          <h1>Talk to GTI.</h1>
          <p>Scottsdale headquarters — sales, service, and applications support worldwide.</p>
        </div>
      </header>
      <section class="section">
        <div class="container split-2">
          <article class="panel">
            <h3>Direct</h3>
            <ul class="list-clean">
              <li>Email: <a href="mailto:sales@gt3i.com">sales@gt3i.com</a></li>
              <li>Phone: <a href="tel:+14804006910">480-400-6910</a></li>
              <li>Toll-free: <a href="tel:+18006084834">800-608-4834</a></li>
              <li>15936 N 78th St, Scottsdale, AZ 85260</li>
            </ul>
            <p style="margin-top:1.25rem">Need pricing on a specific tool? Use the <a class="panel-link" href="quote.html">quote form</a>.</p>
          </article>
          <article class="panel">
            <h3>Message</h3>
            <form class="form" data-formsubmit data-subject="GTI website contact">
              <input type="hidden" name="_captcha" value="false" />
              <div data-status hidden></div>
              <label>Name<input name="name" required /></label>
              <label>Email<input name="email" type="email" required /></label>
              <label>Message<textarea name="message" required></textarea></label>
              <button class="btn btn-primary" type="submit">Send message</button>
            </form>
          </article>
        </div>
      </section>
    </main>
    <footer class="footer" id="site-footer"></footer>
  </div>
  <script src="assets/site.js"></script>
</body>
</html>

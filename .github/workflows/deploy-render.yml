# Deprecated: prefer Cloudflare Pages (see docs/MIGRATE_FROM_RENDER.md). No-ops without RENDER_API_KEY.
name: Deploy to Render
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (if secrets present)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY not set — skipping auto-deploy."
            exit 0
          fi
          if [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Creating static site via Render API…"
            curl -sS -X POST "https://api.render.com/v1/services" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "type": "static_site",
                "name": "gti-website",
                "repo": "https://github.com/NeVoTM/gti-website",
                "branch": "main",
                "buildCommand": "true",
                "staticPublishPath": ".",
                "autoDeploy": "yes"
              }'
            exit 0
          fi
          curl -sS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
